apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shoehorn.fullname" . }}-worker
  namespace: {{ include "shoehorn.namespace.backend" . }}
  labels:
    {{- include "shoehorn.worker.labels" . | nindent 4 }}
  annotations:
    {{- include "shoehorn.serviceAnnotations" (dict "root" . "service" .Values.worker.annotations) | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount.worker }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "shoehorn.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-backend.yaml") . | sha256sum }}
        {{- include "shoehorn.serviceAnnotations" (dict "root" . "service" .Values.worker.annotations) | nindent 8 }}
      labels:
        {{- include "shoehorn.worker.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "shoehorn.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "shoehorn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      # Wait for infrastructure services to be ready.
      # The worker talks to Postgres from its first scheduler tick but does not
      # run migrations; only the api does. This gate covers reachability, not
      # schema version: during a rolling upgrade the old api keeps serving while
      # the new migration has not run, so nothing observable from here proves the
      # schema matches the binary. Jobs that read a newly added column handle
      # that themselves (see internal/k8sgc, which skips a cycle on SQLSTATE
      # 42703 instead of erroring).
      - name: wait-for-postgresql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ include "shoehorn.postgresql.host" . }} {{ include "shoehorn.postgresql.port" . }}; do echo waiting for postgresql; sleep 2; done;']
      - name: wait-for-redpanda
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ include "shoehorn.redpanda.host" . }} {{ include "shoehorn.redpanda.port" . }}; do echo waiting for redpanda; sleep 2; done;']
      # The api runs migrations before it starts serving, so on a fresh install
      # or a scale-up this also means the schema is ready. It does NOT mean that
      # on a rolling upgrade: the old api answers on this port while the new
      # migration is still pending. Same gate crawler and forge already use.
      - name: wait-for-api
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ include "shoehorn.fullname" . }}-api 8080; do echo waiting for api; sleep 2; done;']
      containers:
      - name: worker
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: {{ include "shoehorn.componentImage" (dict "component" .Values.worker "Values" .Values "Chart" .Chart) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.worker.env.HTTP_PORT }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.worker.env.GRPC_PORT }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "shoehorn.fullname" . }}-backend
        - configMapRef:
            name: {{ include "shoehorn.fullname" . }}-backend-overrides
            optional: true
        env:
        - name: LOG_LEVEL
          value: {{ .Values.worker.logLevel | default "info" | quote }}
        # Service-specific configuration
        - name: SERVICE_NAME
          value: "worker"
        - name: HTTP_PORT
          value: {{ .Values.worker.env.HTTP_PORT | quote }}
        - name: GRPC_PORT
          value: {{ .Values.worker.env.GRPC_PORT | quote }}

        # Database configuration (secrets and dynamic values)
        - name: DB_HOST
          value: {{ include "shoehorn.postgresql.host" . }}
        {{- include "shoehorn.secretRef" (dict "env" "DB_PASSWORD" "ref" .Values.postgresql.passwordSecretRef "root" .) | nindent 8 }}

        # Valkey/Redis. The worker reads VALKEY_ADDR, not the ConfigMap's
        # VALKEY_HOST/VALKEY_PORT, so it is built here as for the api.
        - name: VALKEY_ADDR
          value: "{{ include "shoehorn.valkey.host" . }}:{{ include "shoehorn.valkey.port" . }}"
        {{- include "shoehorn.secretRef" (dict "env" "VALKEY_PASSWORD" "ref" .Values.valkey.passwordSecretRef "root" .) | nindent 8 }}

        # Meilisearch (secret only, host/port/protocol in ConfigMap)
        {{- include "shoehorn.secretRef" (dict "env" "MEILISEARCH_MASTER_KEY" "ref" .Values.meilisearch.masterKeySecretRef "root" .) | nindent 8 }}

        # Keycloak directory indexing. The worker builds its own admin client
        # independently of AUTH_PROVIDER/the api service - this is the only
        # provider the worker indexes users from directly, so it's gated on
        # the admin secret being configured at all, not on auth.provider.
        {{- if and .Values.auth.keycloak.adminClientSecretRef .Values.auth.keycloak.adminClientSecretRef.key }}
        - name: KEYCLOAK_URL
          value: {{ .Values.auth.keycloak.url | quote }}
        - name: KEYCLOAK_REALM
          value: {{ .Values.auth.keycloak.realm | quote }}
        - name: KEYCLOAK_ADMIN_CLIENT_ID
          value: {{ .Values.auth.keycloak.adminClientId | default "shoehorn-api" | quote }}
        {{- include "shoehorn.secretRef" (dict "env" "KEYCLOAK_ADMIN_CLIENT_SECRET" "ref" .Values.auth.keycloak.adminClientSecretRef "root" .) | nindent 8 }}
        {{- end }}

        # Identity issuer for IdP team sync. The worker stores group members in
        # the authid form sign-in writes, which is built from the provider's
        # issuer. Without it the sync writes no memberships and logs the missing
        # setting. Same values the api gets; Keycloak's come from the block above.
        {{- if .Values.auth.okta.domain }}
        - name: OKTA_DOMAIN
          value: {{ .Values.auth.okta.domain | quote }}
        {{- end }}
        {{- if .Values.auth.okta.issuer }}
        - name: OKTA_ISSUER
          value: {{ .Values.auth.okta.issuer | quote }}
        {{- end }}
        {{- if eq .Values.auth.provider "zitadel" }}
        - name: ZITADEL_URL
          value: {{ .Values.auth.zitadel.externalUrl | quote }}
        {{- end }}
        {{- if .Values.auth.entraId.tenantId }}
        - name: ENTRA_TENANT_ID
          value: {{ .Values.auth.entraId.tenantId | quote }}
        {{- end }}

        # Redpanda/Kafka topic tuning. The worker is the only service that
        # creates Redpanda topics and enforces their retention config on
        # boot, so it's the only deployment that needs these (REDPANDA_BROKERS
        # itself comes from the shared backend ConfigMap via envFrom above).
        - name: REDPANDA_TOPIC_PARTITIONS
          value: {{ .Values.redpanda.topicPartitions | default 1 | int64 | quote }}
        - name: REDPANDA_REPLICATION_FACTOR
          value: {{ .Values.redpanda.replicationFactor | default 1 | int64 | quote }}
        - name: REDPANDA_TOPIC_RETENTION_MS
          value: {{ .Values.redpanda.topicRetentionMs | default 86400000 | int64 | quote }}
        - name: REDPANDA_TOPIC_RETENTION_BYTES
          value: {{ .Values.redpanda.topicRetentionBytes | default 134217728 | int64 | quote }}
        - name: REDPANDA_TOPIC_SEGMENT_BYTES
          value: {{ .Values.redpanda.topicSegmentBytes | default 16777216 | int64 | quote }}
        - name: REDPANDA_TOPIC_SEGMENT_MS
          value: {{ .Values.redpanda.topicSegmentMs | default 86400000 | int64 | quote }}

        # Distributed Tracing (OpenTelemetry)
        - name: TRACING_ENABLED
          value: {{ .Values.global.tracing.enabled | default false | quote }}
        {{- if .Values.global.tracing.otlpEndpoint }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.global.tracing.otlpEndpoint | quote }}
        {{- end }}

        # gRPC mTLS
        - name: GRPC_TLS_ENABLED
          value: {{ .Values.global.mtls.enabled | default false | quote }}
        {{- if .Values.global.mtls.enabled }}
        - name: GRPC_TLS_CERT_FILE
          value: {{ .Values.global.mtls.certFile | quote }}
        - name: GRPC_TLS_KEY_FILE
          value: {{ .Values.global.mtls.keyFile | quote }}
        - name: GRPC_TLS_CA_FILE
          value: {{ .Values.global.mtls.caFile | quote }}
        {{- end }}
        {{- include "shoehorn.tracingCaEnv" . | nindent 8 }}

        # UpCloud: this flag alone is what registers the cloud-discovery janitor
        # (cmd/worker/wiring.go gates SetCloudJanitorJob on it). Without it the
        # janitor never registers, so entities the provider sync tombstoned as
        # end-of-life are never hard-deleted and accumulate indefinitely.
        #
        # Deliberately no UPCLOUD_TOKEN here: the janitor is pure database
        # cleanup (NewJanitor takes db, logger, rlsHelper, eventBus) and never
        # calls the UpCloud API. Only the crawler needs the credential.
        {{- if .Values.cloudProviders.upcloud.enabled }}
        - name: CLOUD_PROVIDER_UPCLOUD_ENABLED
          value: "true"
        {{- end }}

        {{- if or .Values.global.mtls.enabled (include "shoehorn.tracingCaConfigured" .) }}
        volumeMounts:
        {{- include "shoehorn.grpcMtlsVolumeMounts" . | nindent 8 }}
        {{- include "shoehorn.tracingCaVolumeMounts" . | nindent 8 }}
        {{- end }}

        livenessProbe:
          {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
        readinessProbe:
          {{- toYaml .Values.worker.readinessProbe | nindent 12 }}
        resources:
          {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- if or .Values.global.mtls.enabled (include "shoehorn.tracingCaConfigured" .) }}
      volumes:
      {{- include "shoehorn.grpcMtlsVolumes" . | nindent 6 }}
      {{- include "shoehorn.tracingCaVolumes" . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
