suite: web container environment
templates:
  - templates/deployment-web.yaml
release:
  name: test-release
  namespace: test-ns
set:
  # Chart refuses to default to :latest, so component renders need an explicit tag.
  image.tag: 0.0.0-test
  global.domain: idp.acme.test
tests:
  - it: runs the web server as production, like the backend
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENVIRONMENT
            value: production
