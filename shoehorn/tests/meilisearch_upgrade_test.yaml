suite: meilisearch.upgradeOnStart
release:
  name: test-release
  namespace: test-ns
templates:
  - templates/statefulset-meilisearch.yaml
set:
  meilisearch.masterKeySecretRef:
    name: my-search-secret
    key: meili_key
tests:
  - it: migrates the data directory in place by default when the image moves to a newer version
    documentIndex: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE
            value: "true"

  - it: leaves the upgrade flag out when turned off
    documentIndex: 1
    set:
      meilisearch.upgradeOnStart: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE
            value: "true"
