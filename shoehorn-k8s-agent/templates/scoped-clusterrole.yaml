{{- if and .Values.rbac.create (eq .Values.agent.kubernetes.scopeMode "namespaces") -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shoehorn-agent.fullname" . }}-scoped
  labels:
    {{- include "shoehorn-agent.labels" . | nindent 4 }}
  annotations:
    {{- include "shoehorn-agent.annotations" . | nindent 4 }}
rules:
  # Namespace labels drive team ownership; scoped mode GETs only the
  # configured namespaces by name.
  - apiGroups: [""]
    resources:
      - namespaces
    resourceNames:
      {{- range .Values.agent.kubernetes.namespaces }}
      - {{ . | quote }}
      {{- end }}
    verbs:
      - get
  # Node count (heartbeat), provider detection, and per-node version facts
  # (agent.nodeInfo.enabled). List only - read-only, not tenant-sensitive.
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - list
  {{- if .Values.agent.connected.enabled }}
  # Connected-resource resolution: ClusterRoles and ClusterRoleBindings are
  # cluster-scoped so they live here (namespace-scoped Roles/RoleBindings are
  # in scoped-role.yaml via the per-namespace Roles).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shoehorn-agent.fullname" . }}-scoped
  labels:
    {{- include "shoehorn-agent.labels" . | nindent 4 }}
  annotations:
    {{- include "shoehorn-agent.annotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shoehorn-agent.fullname" . }}-scoped
subjects:
  - kind: ServiceAccount
    name: {{ include "shoehorn-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
