{{- $pdb := .Values.podDisruptionBudget }}
{{- $hasMin := or (eq ($pdb.minAvailable | toString) "0") $pdb.minAvailable }}
{{- $hasMax := or (eq ($pdb.maxUnavailable | toString) "0") $pdb.maxUnavailable }}
{{- if and $pdb.enabled (gt (int .Values.replicaCount) 1) (or $hasMin $hasMax) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "shoehorn-agent.fullname" . }}
  labels:
    {{- include "shoehorn-agent.labels" . | nindent 4 }}
  annotations:
    {{- include "shoehorn-agent.annotations" . | nindent 4 }}
spec:
  {{- if $hasMin }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "shoehorn-agent.selectorLabels" . | nindent 6 }}
{{- end }}
