suite: node info toggle
templates:
  - templates/configmap.yaml
release:
  name: test-release
  namespace: test-ns
set:
  shoehorn.apiURL: https://shoehorn.example.test
  shoehorn.cluster.id: test-cluster
  shoehorn.apiToken: test-token
tests:
  - it: turns node/control-plane version collection on by default
    asserts:
      - equal:
          path: data.SHOEHORN_NODE_INFO_ENABLED
          value: "true"

  # The agent's own default is on, so leaving the key out would not turn
  # collection off. Disabling it must render an explicit "false".
  - it: renders an explicit false when collection is disabled
    set:
      agent.nodeInfo.enabled: false
    asserts:
      - equal:
          path: data.SHOEHORN_NODE_INFO_ENABLED
          value: "false"
