# Tuning preset for large clusters (roughly 200+ nodes or 5000+ pods).
# Start here, then watch these two metrics; if either climbs, raise the
# matching buffer another step:
#   shoehorn_k8s_watcher_events_dropped_total  -> raise eventChannelSize / rateLimit
#   shoehorn_batcher_batches_dropped_total     -> raise batchChannelSize
#
# Usage:
#   helm install shoehorn-agent oci://ghcr.io/shoehorn-dev/charts/shoehorn-k8s-agent \
#     -f values-large-cluster.yaml \
#     --set shoehorn.apiURL=https://shoehorn.example.com \
#     --set shoehorn.apiToken=$TOKEN \
#     --set shoehorn.cluster.id=aks-prod-westeurope

agent:
  # A resync re-lists every watched object; on a big cluster the default 10m
  # produces periodic event floods. 30m keeps reconciliation without the churn.
  resyncPeriod: 30m

  # Buffers sized for deploy waves on thousands of pods.
  eventChannelSize: "10000"
  batchChannelSize: "200"

  # Let bursts through instead of dropping them; the batcher still smooths
  # the push volume.
  rateLimit: "500"
  rateBurst: "2000"

  # Bigger batches, same 30s cadence: fewer, larger pushes.
  batchSize: 500

  kubernetes:
    # With connected resources on, a push makes about 2 + 7 x (namespaces in
    # the push) Kubernetes API calls, one at a time. A 500-event batch across
    # 150 namespaces is about 1050 calls. At the agent default of 50/s the
    # limiter alone spreads them over about 19s, against a 20s shutdown window,
    # before any API server response time. At 200/s the limiter wait is about 3s.
    apiQPS: "200"
    apiBurst: "400"

# Memory grows with the watched objects. In a test, the agent's startup list of
# 20,000 Deployments and Pods peaked at about 150 MiB of Go heap, and about
# 230 MiB with connected resources on across 200 namespaces; container memory
# runs above that, so the chart's default 150Mi limit is too small at this size. The startup list waits for Shoehorn instead of dropping
# workloads, so the buffers above no longer decide whether it completes.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# HA: leader election makes extra replicas cheap standbys.
replicaCount: 2
podDisruptionBudget:
  enabled: true
  maxUnavailable:
  minAvailable: 1
